<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Michal Toman · devzone</title>
  <meta name="description" content="Michal Toman's notes on AI and web development.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #eef1f4;
      --ink: #1b2430;
      --muted: #5b6675;
      --pen: #2747d6;
      --rule: #c9d1db;
      --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
      --body: "Source Serif 4", Georgia, "Times New Roman", serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a21;
        --ink: #e4e8ee;
        --muted: #98a3b3;
        --pen: #8fa4ff;
        --rule: #2c3441;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 1.125rem/1.7 var(--body);
      padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    }

    /* The notebook margin: one vertical pen line the whole page hangs on */
    .page {
      max-width: 44rem;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 3rem 3rem;
      position: relative;
    }
    .page::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 1.5rem;
      width: 2px;
      background: var(--pen);
      opacity: .55;
    }

    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(3.5rem, 14vw, 7rem);
      line-height: .9;
      letter-spacing: -.04em;
      margin: 0 0 1.75rem;
    }
    h1 small {
      display: block;
      font-weight: 500;
      font-size: .26em;
      letter-spacing: -.01em;
      line-height: 1.2;
      color: var(--muted);
      margin-top: .9rem;
    }

    .intro { max-width: 34rem; margin: 0 0 2.5rem; }
    .intro p { margin: 0 0 1rem; }

    .contact {
      list-style: none;
      padding: 0;
      margin: 0 0 4rem;
      display: flex;
      flex-wrap: wrap;
      gap: .5rem 1.75rem;
      font-family: var(--display);
      font-weight: 500;
      font-size: 1.05rem;
    }

    a {
      color: var(--pen);
      text-decoration-thickness: 1px;
      text-underline-offset: .2em;
    }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible {
      outline: 2px solid var(--pen);
      outline-offset: 3px;
      border-radius: 2px;
    }

    h2 {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.75rem;
      letter-spacing: -.02em;
      margin: 0 0 1rem;
      padding-bottom: .5rem;
      border-bottom: 1px solid var(--rule);
    }

    .notes { list-style: none; padding: 0; margin: 0 0 4rem; }
    .notes li {
      display: grid;
      grid-template-columns: 6.5rem 1fr;
      gap: 1rem;
      padding: .6rem 0;
      border-bottom: 1px solid var(--rule);
    }
    .notes time { color: var(--muted); font-size: 1rem; font-variant-numeric: tabular-nums; }
    .empty { color: var(--muted); font-style: italic; margin: 0 0 4rem; }

    footer { color: var(--muted); font-size: .95rem; }

    @media (max-width: 30rem) {
      .page { padding: 3rem 1.25rem 2.5rem 2.25rem; }
      .page::before { left: 1rem; }
      .notes li { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>devzone<small>Michal Toman, Brno</small></h1>

    <div class="intro">
      <p>I’m Michal, a developer based in Brno. I use this site to keep notes on AI and web development.</p>
    </div>

    <ul class="contact">
      <li><a href="mailto:michal@devzone.cz">Email</a></li>
      <li><a href="https://www.linkedin.com/in/mtoman/">LinkedIn</a></li>
      <li><a href="https://github.com/bas87">GitHub</a></li>
    </ul>

    <section aria-labelledby="notes-title">
      <h2 id="notes-title">Notes</h2>
      <p class="empty">No notes yet.</p>

      <!--
        When you add your first note, delete the .empty paragraph above and uncomment this list.
        Put the newest note at the top.

      <ul class="notes">
        <li>
          <time datetime="2026-11-15">Nov 15, 2026</time>
          <a href="/notes/first-note.html">Title of the first note</a>
        </li>
      </ul>
      -->
    </section>

    <footer>© 2026 Michal Toman</footer>
  </main>
</body>
</html>
