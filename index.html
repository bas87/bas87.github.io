<!doctype html>
<html lang="en">
  <head>
    <!-- The page shell. index.ts fills in the {{placeholders}} for every page. -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{url}}" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{url}}" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/index.css" />

    <script>
      // Day/night theme. Runs before the page paints, so there's no flash:
      // use the saved choice, otherwise follow the system setting.
      let saved;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      document.documentElement.dataset.theme =
        saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

      function toggleTheme() {
        const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        try { localStorage.setItem('theme', theme); } catch (e) {}
      }
    </script>
  </head>
  <body>
    <main class="page">
      <button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Switch between day and night mode" title="Lights on / off">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="glass" d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" />
          <path d="M9 18h6" />
          <path d="M10 22h4" />
        </svg>
      </button>
{{content}}
    </main>
  </body>
</html>
